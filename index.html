<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trasop skole">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Solbergliveien – Avganger & Vær</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #1c2330;
    --line: rgba(255,255,255,0.08);
    --text: #e6edf3;
    --muted: #7d8590;
    --blue: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --orange: #f0883e;
    --teal: #39d353;
    --accent: #1f6feb;
  }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* TOP BAR */
  .topbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--line);
    padding: 0 2rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .stop-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .stop-badge {
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }
  #clock {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 1px;
  }
  #date-label {
    font-size: 13px;
    color: var(--muted);
  }

  /* MAIN GRID */
  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 0;
    min-height: calc(100vh - 56px);
  }

  /* DEPARTURES PANEL */
  .departures-panel {
    padding: 1.5rem 2rem;
    border-right: 1px solid var(--line);
  }
  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .dot-live { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* DEPARTURE TABLE */
  .dep-table { width: 100%; border-collapse: collapse; }
  .dep-table thead tr {
    border-bottom: 1px solid var(--line);
  }
  .dep-table th {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 0 12px 10px 0;
    text-align: left;
  }
  .dep-table th:last-child { text-align: right; padding-right: 0; }
  .dep-row {
    border-bottom: 1px solid var(--line);
    transition: background 0.15s;
  }
  .dep-row:hover { background: rgba(255,255,255,0.03); }
  .dep-row td {
    padding: 13px 12px 13px 0;
    font-size: 15px;
    vertical-align: middle;
  }
  .dep-row td:last-child { text-align: right; padding-right: 0; }

  .line-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 28px;
    border-radius: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    padding: 0 8px;
    letter-spacing: 0.5px;
  }
  .line-76  { background: #c0392b; color: white; }
  .line-79  { background: #8e44ad; color: white; }
  .line-58  { background: #2980b9; color: white; }
  .line-2n  { background: #16213e; color: #58a6ff; border: 1px solid #58a6ff33; }
  .line-def { background: #2c3e50; color: white; }

  .dest-name {
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
  }
  .platform-tag {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .eta-cell {
    text-align: right;
  }
  .eta-now {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.5px;
  }
  .eta-min {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .eta-min .unit { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .eta-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px;
    color: var(--muted);
  }
  .delay-tag {
    font-size: 11px;
    color: var(--red);
    display: block;
  }
  .realtime-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    display: inline-block;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* DIRECTION BLOCKS */
  .direction-block {
    margin-bottom: 1.75rem;
  }
  .direction-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: 6px 6px 0 0;
    border-bottom: none;
    margin-bottom: 0;
  }
  .direction-arrow {
    font-size: 14px;
    color: var(--blue);
    font-weight: 700;
  }
  .direction-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .direction-dest {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-left: auto;
    opacity: 0.7;
  }
  .direction-block .dep-table {
    border: 1px solid var(--line);
    border-radius: 0 0 6px 6px;
    overflow: hidden;
    width: 100%;
    border-collapse: collapse;
  }
  .direction-block .dep-table thead tr {
    background: rgba(255,255,255,0.02);
  }

  /* STOP SELECTOR */
  .stop-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .stop-btn {
    background: var(--bg3);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .stop-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
  .stop-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* STATUS */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    margin-top: 0.75rem;
  }
  #refresh-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Barlow', sans-serif;
    transition: all 0.15s;
  }
  #refresh-btn:hover { border-color: var(--blue); color: var(--blue); }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  .spinner.active { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ERROR / EMPTY */
  .dep-empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 14px;
  }
  .dep-empty .icon { font-size: 32px; margin-bottom: 0.5rem; opacity: 0.4; }

  /* RIGHT PANEL */
  .right-panel {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* WEATHER CARD */
  .weather-card {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.25rem;
  }
  .weather-now {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 1rem;
  }
  .weather-temp {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 52px;
    font-weight: 300;
    color: var(--text);
    line-height: 1;
  }
  .weather-temp sup { font-size: 22px; font-weight: 400; vertical-align: top; margin-top: 6px; display: inline-block; }
  .weather-icon-wrap { text-align: right; }
  .weather-icon { font-size: 48px; line-height: 1; }
  .weather-desc {
    font-size: 14px;
    color: var(--muted);
    margin-top: 4px;
  }
  .weather-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    border-top: 1px solid var(--line);
    padding-top: 1rem;
  }
  .weather-meta-item {
    display: flex;
    flex-direction: column;
  }
  .meta-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .meta-value { font-size: 16px; font-weight: 500; color: var(--text); margin-top: 2px; }

  /* HOURLY FORECAST */
  .hourly-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    margin-top: 1rem;
    border-top: 1px solid var(--line);
    padding-top: 1rem;
  }
  .hour-item {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .hour-time { font-size: 11px; color: var(--muted); }
  .hour-icon { font-size: 18px; line-height: 1; }
  .hour-temp { font-size: 13px; font-weight: 500; color: var(--text); }
  .hour-precip { font-size: 10px; color: #58a6ff; }

  /* DAILY FORECAST */
  .daily-card {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .daily-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 1.25rem;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .daily-row:last-child { border-bottom: none; }
  .daily-day { font-weight: 500; width: 48px; color: var(--text); }
  .daily-icon { font-size: 18px; flex: 1; text-align: center; }
  .daily-precip { font-size: 12px; color: var(--blue); width: 36px; text-align: right; }
  .daily-temps { display: flex; gap: 6px; align-items: center; }
  .temp-hi { font-weight: 600; color: var(--text); }
  .temp-lo { color: var(--muted); }

  /* ALERTS CARD */
  .alert-card {
    background: rgba(210,153,34,0.08);
    border: 1px solid rgba(210,153,34,0.3);
    border-radius: 10px;
    padding: 1rem;
    font-size: 13px;
    color: var(--yellow);
    display: none;
  }
  .alert-card.visible { display: block; }

  /* REFRESH INDICATOR */
  .refresh-info {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .departures-panel { border-right: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="stop-name">Trasop skole</span>
    <span class="stop-badge">Oslo</span>
  </div>
  <div class="topbar-right">
    <div style="text-align:right">
      <div id="clock">--:--</div>
      <div id="date-label">–</div>
    </div>
  </div>
</div>

<div class="main">

  <!-- DEPARTURES -->
  <div class="departures-panel">
    <div class="section-title">
      <span class="dot dot-live"></span>
      Sanntidsavganger
    </div>

    <div class="stop-selector" id="stop-selector">
      <button class="stop-btn active" data-id="NSR:StopPlace:5852" data-name="Trasop skole (alle)">Alle retninger</button>
    </div>

    <div id="dep-container">
      <div class="dep-empty"><div class="icon">🚌</div><p>Henter avganger…</p></div>
    </div>

    <div class="status-bar">
      <div class="spinner" id="spinner"></div>
      <span id="status-text">–</span>
      <button id="refresh-btn" onclick="fetchDepartures()">↻ Oppdater</button>
    </div>
  </div>

  <!-- WEATHER + FORECAST -->
  <div class="right-panel">

    <div class="section-title">
      <span class="dot" style="background: var(--blue);"></span>
      Vær – Trasop / Bøler
    </div>

    <!-- CURRENT WEATHER -->
    <div class="weather-card" id="weather-now-card">
      <div style="text-align:center; color: var(--muted); font-size:13px; padding: 2rem 0;">Henter værdata…</div>
    </div>

    <!-- HOURLY -->
    <div class="weather-card" id="weather-hourly-card" style="display:none">
      <div class="section-title" style="margin-bottom:0">Neste 6 timer</div>
      <div class="hourly-row" id="hourly-row"></div>
    </div>

    <!-- DAILY -->
    <div class="daily-card" id="weather-daily-card" style="display:none">
      <div style="padding: 10px 1.25rem; border-bottom: 1px solid var(--line);">
        <span style="font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:600;">Neste dager</span>
      </div>
      <div id="daily-rows"></div>
    </div>

    <div class="refresh-info" id="weather-updated"></div>
  </div>
</div>

<script>
// ── CONFIGURATION ──────────────────────────────────────────────────
const STOP_ID = 'NSR:StopPlace:6214'; // Trasop skole – Entur NSR (verifisert)
const LAT = 59.8963;
const LON = 10.8537;
const ENTUR_URL = 'https://api.entur.io/journey-planner/v3/graphql';
const YR_BASE = `https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${LAT}&lon=${LON}`;
// CORS proxy needed because browsers can't set User-Agent header directly
const YR_URL = `https://corsproxy.io/?url=${encodeURIComponent(YR_BASE)}`;
const REFRESH_MS = 30000;

// ── CLOCK ──────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('date-label').textContent =
    now.toLocaleDateString('no-NO', { weekday: 'long', day: 'numeric', month: 'long' });
}
setInterval(updateClock, 1000);
updateClock();

// ── WEATHER ICONS (WMO symbol codes from Yr) ──────────────────────
function getWeatherIcon(symbol) {
  const s = symbol ? symbol.replace('_night','').replace('_polartwilight','') : '';
  const map = {
    clearsky: '☀️', fair: '🌤️', partlycloudy: '⛅', cloudy: '☁️',
    rainshowers: '🌦️', rainshowersandthunder: '⛈️',
    sleetshowers: '🌨️', snowshowers: '❄️',
    rain: '🌧️', heavyrain: '🌧️', lightrainshowers: '🌦️',
    rainandthunder: '⛈️', sleetandthunder: '⛈️',
    lightsleet: '🌨️', heavysleet: '🌨️', lightsnow: '🌨️', snow: '❄️',
    heavysnow: '❄️', fog: '🌫️',
  };
  for (const [k, v] of Object.entries(map)) {
    if (s.includes(k)) return v;
  }
  return '🌡️';
}

function describeSymbol(symbol) {
  const s = symbol ? symbol.replace('_night','').replace('_polartwilight','') : '';
  const map = {
    clearsky: 'Klart', fair: 'Lettskyet', partlycloudy: 'Delvis skyet',
    cloudy: 'Overskyet', rainshowers: 'Regnbyger', heavyrain: 'Kraftig regn',
    rain: 'Regn', lightrainshowers: 'Lette regnbyger', lightsleet: 'Sludd',
    snow: 'Snø', lightsnow: 'Lett snø', fog: 'Tåke', rainandthunder: 'Tordenvær',
  };
  for (const [k, v] of Object.entries(map)) {
    if (s.includes(k)) return v;
  }
  return symbol || '–';
}

function windDir(deg) {
  const dirs = ['N','NNØ','NØ','ØNØ','Ø','ØSØ','SØ','SSØ','S','SSV','SV','VSV','V','VNV','NV','NNV'];
  return dirs[Math.round(deg / 22.5) % 16];
}

// ── FETCH WEATHER ──────────────────────────────────────────────────
async function fetchWeather() {
  try {
    const res = await fetch(YR_URL);
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    renderWeather(data);
    const updated = new Date(data.properties.meta.updated_at);
    document.getElementById('weather-updated').textContent =
      'Vær oppdatert: ' + updated.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    document.getElementById('weather-now-card').innerHTML =
      `<div style="text-align:center;color:var(--red);font-size:13px;padding:1rem">Kunne ikke hente vær (${e.message})</div>`;
  }
}

function renderWeather(data) {
  const ts = data.properties.timeseries;
  const now = ts[0];
  const inst = now.data.instant.details;
  const next1 = now.data.next_1_hours || now.data.next_6_hours;
  const symbol = next1 ? next1.summary.symbol_code : 'clearsky';
  const precip = next1 ? next1.details.precipitation_amount : 0;

  // Current
  const card = document.getElementById('weather-now-card');
  card.innerHTML = `
    <div class="weather-now">
      <div>
        <div class="weather-temp">${Math.round(inst.air_temperature)}<sup>°C</sup></div>
        <div class="weather-desc">${describeSymbol(symbol)}</div>
      </div>
      <div class="weather-icon-wrap">
        <div class="weather-icon">${getWeatherIcon(symbol)}</div>
        ${precip > 0 ? `<div style="font-size:12px;color:var(--blue);text-align:right;margin-top:4px">💧 ${precip.toFixed(1)} mm</div>` : ''}
      </div>
    </div>
    <div class="weather-meta">
      <div class="weather-meta-item">
        <span class="meta-label">Vind</span>
        <span class="meta-value">${Math.round(inst.wind_speed)} m/s ${windDir(inst.wind_from_direction)}</span>
      </div>
      <div class="weather-meta-item">
        <span class="meta-label">Luftfuktighet</span>
        <span class="meta-value">${Math.round(inst.relative_humidity)} %</span>
      </div>
      <div class="weather-meta-item">
        <span class="meta-label">Lufttrykk</span>
        <span class="meta-value">${Math.round(inst.air_pressure_at_sea_level)} hPa</span>
      </div>
      <div class="weather-meta-item">
        <span class="meta-label">Skydekke</span>
        <span class="meta-value">${Math.round(inst.cloud_area_fraction)} %</span>
      </div>
    </div>`;

  // Hourly (next 6 entries ~1hr apart)
  const hourCard = document.getElementById('weather-hourly-card');
  const hourlyRow = document.getElementById('hourly-row');
  hourlyRow.innerHTML = '';
  const hourSlots = ts.slice(1, 7);
  hourSlots.forEach(slot => {
    const t = new Date(slot.time);
    const d = slot.data;
    const sym = (d.next_1_hours || d.next_6_hours);
    const symCode = sym ? sym.summary.symbol_code : 'clearsky';
    const pr = sym ? sym.details.precipitation_amount : 0;
    const el = document.createElement('div');
    el.className = 'hour-item';
    el.innerHTML = `
      <span class="hour-time">${t.toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'})}</span>
      <span class="hour-icon">${getWeatherIcon(symCode)}</span>
      <span class="hour-temp">${Math.round(d.instant.details.air_temperature)}°</span>
      <span class="hour-precip">${pr > 0 ? pr.toFixed(1)+'mm' : ''}</span>`;
    hourlyRow.appendChild(el);
  });
  hourCard.style.display = 'block';

  // Daily forecast – group by day using ISO date string as key (avoids locale parsing bugs)
  const dailyCard = document.getElementById('weather-daily-card');
  const dailyRows = document.getElementById('daily-rows');
  dailyRows.innerHTML = '';
  const days = {};
  const todayKey = new Date().toISOString().slice(0, 10);
  ts.forEach(slot => {
    const key = slot.time.slice(0, 10); // 'yyyy-mm-dd' directly from API
    if (key === todayKey) return;
    if (!days[key]) days[key] = { temps: [], precip: 0, symbols: [] };
    days[key].temps.push(slot.data.instant.details.air_temperature);
    const sym = slot.data.next_6_hours || slot.data.next_1_hours;
    if (sym) {
      days[key].precip += sym.details.precipitation_amount || 0;
      days[key].symbols.push(sym.summary.symbol_code);
    }
  });
  const dayNames = ['Søn','Man','Tir','Ons','Tor','Fre','Lør'];
  let count = 0;
  for (const [key, val] of Object.entries(days)) {
    if (count++ >= 5) break;
    // Parse yyyy-mm-dd safely by using T12:00 to avoid UTC midnight timezone shift
    const date = new Date(key + 'T12:00:00');
    const dayName = dayNames[date.getDay()];
    const hi = Math.round(Math.max(...val.temps));
    const lo = Math.round(Math.min(...val.temps));
    const mainSym = val.symbols[Math.floor(val.symbols.length/2)] || 'clearsky';
    const row = document.createElement('div');
    row.className = 'daily-row';
    row.innerHTML = `
      <span class="daily-day">${dayName}</span>
      <span class="daily-icon">${getWeatherIcon(mainSym)}</span>
      <span class="daily-precip">${val.precip > 0.5 ? val.precip.toFixed(0)+'mm' : ''}</span>
      <span class="daily-temps"><span class="temp-hi">${hi}°</span><span class="temp-lo">${lo}°</span></span>`;
    dailyRows.appendChild(row);
  }
  dailyCard.style.display = 'block';
}

// ── DEPARTURES (ENTUR GRAPHQL) ────────────────────────────────────
const DEPARTURES_QUERY = `
query($stopId: String!, $n: Int!) {
  stopPlace(id: $stopId) {
    name
    quays {
      id
      name
      description
      publicCode
      estimatedCalls(numberOfDepartures: $n, timeRange: 72000, omitNonBoarding: true) {
        realtime
        aimedDepartureTime
        expectedDepartureTime
        destinationDisplay { frontText }
        serviceJourney {
          line {
            publicCode
            transportMode
          }
        }
      }
    }
  }
}`;

function lineClass(code) {
  const c = String(code);
  if (c === '76') return 'line-76';
  if (c === '79') return 'line-79';
  if (c === '58') return 'line-58';
  if (c === '2N' || c.toLowerCase() === '2n') return 'line-2n';
  return 'line-def';
}

async function fetchDepartures() {
  document.getElementById('spinner').classList.add('active');
  document.getElementById('status-text').textContent = 'Henter avganger…';

  try {
    const res = await fetch(ENTUR_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'ET-Client-Name': 'trasop-skole-monitor'
      },
      body: JSON.stringify({
        query: DEPARTURES_QUERY,
        variables: { stopId: STOP_ID, n: 5 }
      })
    });
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    renderDepartures(json.data);
    document.getElementById('status-text').textContent =
      'Oppdatert ' + new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  } catch (e) {
    document.getElementById('dep-container').innerHTML =
      `<div class="dep-empty"><div class="icon">⚠️</div><p>Feil ved henting av avganger<br><small style="color:var(--muted)">${e.message}</small></p></div>`;
    document.getElementById('status-text').textContent = 'Feil – prøv igjen';
  }
  document.getElementById('spinner').classList.remove('active');
}

function renderDepartures(data) {
  if (!data || !data.stopPlace) {
    document.getElementById('dep-container').innerHTML =
      `<div class="dep-empty"><div class="icon">🔍</div><p>Ingen stoppested funnet</p></div>`;
    return;
  }

  const quays = data.stopPlace.quays || [];
  const now = new Date();

  // Build per-quay direction buckets
  const quayBuckets = [];
  quays.forEach(q => {
    const calls = q.estimatedCalls || [];
    if (!calls.length) return;
    const label = q.description || q.name || ('Plattform ' + (q.publicCode || '?'));
    // Pick the most frequent destination as the direction hint
    const freq = {};
    calls.forEach(c => { const d = c.destinationDisplay.frontText; freq[d] = (freq[d]||0)+1; });
    const mainDest = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];
    const deps = calls.map(call => ({
      line: call.serviceJourney.line.publicCode,
      dest: call.destinationDisplay.frontText,
      aimed: new Date(call.aimedDepartureTime),
      expected: new Date(call.expectedDepartureTime),
      realtime: call.realtime
    })).sort((a,b) => a.expected - b.expected);
    quayBuckets.push({ label, mainDest, deps });
  });

  if (!quayBuckets.length) {
    document.getElementById('dep-container').innerHTML =
      `<div class="dep-empty"><div class="icon">🌙</div><p>Ingen avganger i nær fremtid</p></div>`;
    return;
  }

  function etaHtml(dep) {
    const diffMin = Math.floor((dep.expected - now) / 60000);
    const delayMin = Math.round((dep.expected - dep.aimed) / 60000);
    let eta;
    if (diffMin <= 0) {
      eta = `<span class="eta-now">Nå</span>`;
    } else if (diffMin < 20) {
      eta = `<span class="eta-min">${diffMin}<span class="unit">min</span></span>`;
    } else {
      eta = `<span class="eta-time">${dep.expected.toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'})}</span>`;
    }
    const delay = delayMin > 1 ? `<span class="delay-tag">+${delayMin} min forsinket</span>` : '';
    const rt = dep.realtime ? `<span class="realtime-dot" title="Sanntid"></span>` : '';
    return `<tr class="dep-row">
      <td><span class="line-badge ${lineClass(dep.line)}">${dep.line}</span></td>
      <td><div class="dest-name">${dep.dest}${rt}</div>${delay ? `<div>${delay}</div>` : ''}</td>
      <td class="eta-cell">${eta}</td>
    </tr>`;
  }

  const html = quayBuckets.map(bucket => `
    <div class="direction-block">
      <div class="direction-header">
        <span class="direction-arrow">→</span>
        <span class="direction-label">${bucket.label}</span>
        <span class="direction-dest">${bucket.mainDest}</span>
      </div>
      <table class="dep-table">
        <thead><tr>
          <th>Linje</th><th>Destinasjon</th><th style="text-align:right">Avgang</th>
        </tr></thead>
        <tbody>${bucket.deps.map(etaHtml).join('')}</tbody>
      </table>
    </div>`).join('');

  document.getElementById('dep-container').innerHTML = html;
}

// ── AUTO REFRESH ──────────────────────────────────────────────────
fetchDepartures();
fetchWeather();
setInterval(fetchDepartures, REFRESH_MS);
setInterval(fetchWeather, 600000); // weather every 10min

  navigator.serviceWorker.register('sw.js').catch(() => {});
}
